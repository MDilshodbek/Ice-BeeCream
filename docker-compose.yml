services:
  iceCream:
    container_name: iceCream
    restart: always
    image: node:20.10.0
    ports:
      - 4001:3003
    volumes:
      - ./:/usr/src/iceCream
    working_dir: /usr/src/iceCream

    networks:
      - back_network

    command: bash -c "npm install && npm run build && npm run start:prod"

    # For Development
    # command: bash -c "npm install && npm run build && npm start:dev"

networks:
  back_network:
    driver: bridge
